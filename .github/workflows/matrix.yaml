name: Matrix example
on: push
jobs: 
    deploy:
        strategy:
            matrix: 
                os: [ubuntu-latest, windows-latest, ubuntu-20.04]
                images: [hello-world, alpine]
                exclude:
                    - images: alpine
                      os: windows-latest
                include:
                    - images: amd64/alpine
                      os: ubuntu-20.04
        runs-on: ${{ matrix.os }}
        steps:
            - name: Display info
              run: docker info
            
            - name: Runs ${{ matrix.images }} on ${{ matrix.os }}
              run: docker run ${{ matrix.images }}
