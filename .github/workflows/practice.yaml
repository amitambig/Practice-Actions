name: trying matrix
on: push
jobs:
    setup_tools:
        strategy:
            matrix: 
                os: [ubuntu-latest, macos-14, windows-latest]
                py-version: [3.10, 3.11, 3.12]
        runs-on: ${{ matrix.os }}
        steps:
            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.py-version }}